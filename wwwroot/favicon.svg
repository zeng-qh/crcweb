<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 大圆底：v3 的浅蓝装饰色 -->
  <circle cx="512" cy="512" r="500" fill="#B0D0FF"/>
  <!-- 支架与底座：v2 的玫红实心风格 -->
  <rect x="462" y="640" width="100" height="72" fill="#d4237a"/>
  <rect x="322" y="704" width="380" height="56" rx="28" fill="#d4237a"/>
  <!-- 屏幕：v3 的浅蓝屏面 + v2 的玫红圆角线框 -->
  <rect x="192" y="192" width="640" height="448" rx="40" fill="#D4E9FF" stroke="#d4237a" stroke-width="36"/>
  <!-- 屏幕内六边形：v2 的「实心 + 环」分子元素 -->
  <path d="M390 316 L476.6 366 L476.6 466 L390 516 L303.4 466 L303.4 366 Z" fill="#d4237a"/>
  <path d="M390 361 L437.6 388.5 L437.6 443.5 L390 471 L342.4 443.5 L342.4 388.5 Z" fill="#D4E9FF"/>
  <!-- 屏幕内柱状图：v3 的数据柱，玫红 + 白 -->
  <rect x="540" y="440" width="52" height="126" rx="10" fill="#d4237a"/>
  <rect x="622" y="380" width="52" height="186" rx="10" fill="#FFFFFF"/>
  <rect x="704" y="470" width="52" height="96" rx="10" fill="#d4237a"/>
  <!-- 柱状图基线 -->
  <rect x="524" y="560" width="248" height="18" rx="9" fill="#d4237a"/>
</svg>
